  <style>
    :root {
      --teal-dark: #162828;
      --teal:      #2D6B6B;
      --teal-mid:  #3D8585;
      --terra:     #C4502A;
      --terra-hi:  #E06840;
      --gold:      #D4A843;
      --cream:     #F5F0E6;
      --parchment: #FAF7F0;
      --charcoal:  #2C2420;
      --white:     #FFFFFF;
      --fh:        'Secular One', sans-serif;
      --fb:        'Heebo', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--fb); background: var(--teal-dark);
      color: var(--white); min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 40px 24px;
      position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 60% at 15% 85%, rgba(45,107,107,.45) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 85% 15%, rgba(212,168,67,.14) 0%, transparent 55%);
    }
    body::after {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.016) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.016) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    /* noise */
    body > *:first-child::before {
      content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px; opacity: 0.025;
    }

    .card {
      position: relative; z-index: 2;
      max-width: 560px; width: 100%;
      animation: fadeUp .7s cubic-bezier(0.25,0.46,0.45,0.94) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: none; }
    }

    .monk {
      width: clamp(140px, 30vw, 200px);
      margin: 0 auto 28px;
      animation: float 6s ease-in-out 1s infinite;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

    .check-ring {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(45,107,107,.25);
      border: 2px solid rgba(61,133,133,.5);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px; color: #75bab8;
      box-shadow: 0 0 28px rgba(61,133,133,.3);
    }

    h1 {
      font-family: var(--fh);
      font-size: clamp(32px, 6vw, 52px);
      color: var(--white); line-height: 1.1;
      letter-spacing: -.02em; margin-bottom: 16px;
    }
    h1 em { color: #75bab8; font-style: normal; }

    .sub {
      font-size: clamp(16px, 2vw, 19px);
      color: rgba(255,255,255,.65);
      line-height: 1.75; margin-bottom: 40px;
    }
    .sub strong { color: rgba(255,255,255,.9); }

    .timer-row {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(212,168,67,.1); border: 1px solid rgba(212,168,67,.28);
      padding: 10px 22px; border-radius: 50px; margin-bottom: 40px;
      font-size: 14px; color: var(--gold); font-weight: 700;
    }
    .timer-row i { font-size: 13px; }

    .cta-group {
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
    }
    .btn-wa {
      display: inline-flex; align-items: center; gap: 11px;
      background: #25D366; color: var(--white);
      padding: 15px 36px; border-radius: 50px;
      font-family: var(--fh); font-size: 17px;
      box-shadow: 0 6px 24px rgba(37,211,102,.32);
      text-decoration: none;
      transition: background .3s, transform .3s, box-shadow .3s;
    }
    .btn-wa:hover { background: #1fba58; transform: translateY(-2px); box-shadow: 0 10px 32px rgba(37,211,102,.44); }
    .btn-wa svg { width: 22px; height: 22px; fill: var(--white); flex-shrink: 0; }

    .btn-back {
      font-size: 14px; color: rgba(255,255,255,.4);
      text-decoration: none; transition: color .3s;
    }
    .btn-back:hover { color: rgba(255,255,255,.75); }

    .divider {
      width: 48px; height: 2px;
      background: linear-gradient(90deg, var(--terra), var(--gold));
      border-radius: 2px; margin: 0 auto 28px;
    }

    .brand {
      position: fixed; bottom: 24px; left: 0; right: 0;
      text-align: center; z-index: 2;
      font-family: var(--fh); font-size: 13px;
      color: rgba(255,255,255,.2); letter-spacing: .06em;
    }
  </style>
</head>

    </a>
    <a href="landing.html" class="btn-back">← חזרה לדף הראשי</a>
  </div>
</div>

<div class="brand">טכנורוחניק</div>

</body>
</html>
