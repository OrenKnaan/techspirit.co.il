name: Publish scheduled blog posts

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC = 10:00 Israel (UTC+3)
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write           # needed to commit back to the repo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run publish script
        run: node .github/scripts/publish-posts.js

      - name: Commit and push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && git diff --staged --quiet && echo "Nothing to publish." || (
            git add -A
            git commit -m "Auto-publish: $(date '+%Y-%m-%d')"
            git push
          )
